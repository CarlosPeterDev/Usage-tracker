name: Build and Release Android
on:
  push:
    branches: [main, master, feature/privacy-custom-plan-alerts]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      upload_signed: ${{ steps.signing.outputs.upload_signed }}
    env:
      TRACKER_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      TRACKER_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.ANDROID_KEY_ALIAS || '' }}
      TRACKER_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.ANDROID_KEY_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Configure Android signing
        id: signing
        env:
          TRACKER_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$TRACKER_KEYSTORE_BASE64$TRACKER_STORE_PASSWORD$TRACKER_KEY_ALIAS$TRACKER_KEY_PASSWORD" ]]; then
            echo 'upload_signed=false' >> "$GITHUB_OUTPUT"
            echo 'Development-signed build for testing' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          : "${TRACKER_KEYSTORE_BASE64:?Missing upload keystore}"
          : "${TRACKER_STORE_PASSWORD:?Missing keystore password}"
          : "${TRACKER_KEY_ALIAS:?Missing key alias}"
          : "${TRACKER_KEY_PASSWORD:?Missing key password}"
          umask 077
          keystore="$RUNNER_TEMP/tracker-upload.jks"
          printf '%s' "$TRACKER_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "TRACKER_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo 'upload_signed=true' >> "$GITHUB_OUTPUT"
      - name: Prepare Android project
        run: bash scripts/prepare-android.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Install Android 17 SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-37.0"
      - run: flutter build apk --release --dart-define=USE_NEXT_GEN_SDK=true --build-number "$GITHUB_RUN_NUMBER"
      - run: flutter build appbundle --release --dart-define=USE_NEXT_GEN_SDK=true --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify APK and AAB
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Data-Usage-Tracker.apk
          cp build/app/outputs/bundle/release/*.aab dist/Data-Usage-Tracker.aab
          unzip -tq dist/Data-Usage-Tracker.apk
          unzip -tq dist/Data-Usage-Tracker.aab
          verification="$(LC_ALL=C jarsigner -verify dist/Data-Usage-Tracker.aab)"
          grep -F 'jar verified.' <<< "$verification"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$("$aapt" dump badging dist/Data-Usage-Tracker.apk)"
          grep -F "package: name='com.carlos.data_usage_tracker' versionCode='$GITHUB_RUN_NUMBER'" <<< "$badging"
          grep -Fx "sdkVersion:'24'" <<< "$badging"
          grep -Fx "targetSdkVersion:'37'" <<< "$badging"
          "$(dirname "$aapt")/apksigner" verify --min-sdk-version 24 dist/Data-Usage-Tracker.apk
          "$(dirname "$aapt")/zipalign" -c -P 16 4 dist/Data-Usage-Tracker.apk
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$bundletool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum --check
          java -jar "$bundletool" validate --bundle=dist/Data-Usage-Tracker.aab
          java -jar "$bundletool" dump manifest --bundle=dist/Data-Usage-Tracker.aab > "$RUNNER_TEMP/tracker-manifest.xml"
          python3 - "$RUNNER_TEMP/tracker-manifest.xml" "$GITHUB_RUN_NUMBER" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET

          manifest = ET.parse(sys.argv[1]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          assert manifest.get("package") == "com.carlos.data_usage_tracker"
          assert manifest.get(android + "versionCode") == sys.argv[2]
          sdk = manifest.find("uses-sdk")
          assert sdk.get(android + "minSdkVersion") == "24"
          assert sdk.get(android + "targetSdkVersion") == "37"
          PYTHON
          sha256sum dist/Data-Usage-Tracker.{apk,aab}
      - uses: actions/upload-artifact@v4
        with:
          name: Data-Usage-Tracker
          path: |
            dist/Data-Usage-Tracker.apk
            dist/Data-Usage-Tracker.aab
          if-no-files-found: error
      - name: Enable hardware acceleration for Android 7 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/smoke-android.sh dist/Data-Usage-Tracker.apk

  release:
    needs: build
    if: needs.build.outputs.upload_signed == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    concurrency:
      group: android-release-${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Data-Usage-Tracker
          path: dist
      - name: Publish APK and AAB to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="android-${GITHUB_SHA:0:12}"
          apk=dist/Data-Usage-Tracker.apk
          aab=dist/Data-Usage-Tracker.aab
          test -s "$apk" && test -s "$aab"

          if release="$(gh release view "$tag" --json isDraft,assets)"; then
            if jq -e '.isDraft == false' <<< "$release" >/dev/null; then
              jq -e '[.assets[] | select(.state == "uploaded") | .name] | sort | . == ["Data-Usage-Tracker.aab","Data-Usage-Tracker.apk"]' <<< "$release"
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Data Usage Tracker · Build $GITHUB_RUN_NUMBER" \
              --notes "Android 7+ · APK and Android App Bundle · Commit $GITHUB_SHA"
          fi

          gh release upload "$tag" "$apk" "$aab" --clobber
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          latest=false
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then latest=true; fi
          gh release edit "$tag" --draft=false --latest="$latest"
          gh release view "$tag" --json url,assets
